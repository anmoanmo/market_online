server:
  port: 9001

spring:
  servlet:
    multipart:
      max-request-size: 50MB
      max-file-size: 50MB
  application:
    name: user-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: 6379


  #数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/shop_user_1024?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PWD:1234}

  mail:
   host: ${MAIL_HOST:smtp.example.com}
   username: ${MAIL_USERNAME:change-me@example.com}
   password: ${MAIL_PASSWORD:change-me}
   from: ${MAIL_FROM:change-me@example.com}

   properties.mail.smtp.starttls.enable: true
   properties.mail.smtp.starttls.required: true
   properties.mail.smtp.ssl.enable: true
   default-encoding: utf-8

#配置plus打印sql日志
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl


#设置日志级别,ERROR/WARN/INFO/DEBUG,默认是INFO以上才显示
logging:
  level:
    root: INFO
app:
  upload-storage: ${APP_UPLOAD_STORAGE:local}
  public-upload-base-url: ${PUBLIC_UPLOAD_BASE_URL:http://localhost:8090/uploads/avatar/}
QNY: ${QINIU_DOMAIN:}
AK: ${QINIU_ACCESS_KEY:}
SK: ${QINIU_SECRET_KEY:}
Bucket: ${QINIU_BUCKET:}

minio:
  endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
  accessKey: ${MINIO_ACCESS_KEY:change-me}
  secretKey: ${MINIO_SECRET_KEY:change-me}
  bucket: ${MINIO_BUCKET:404-shop}
  publicEndpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9100}
